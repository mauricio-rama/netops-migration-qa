name: Data Migration Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  data-validation:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netops_admin
          POSTGRES_PASSWORD: netops_password
          POSTGRES_DB: netops_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netops_admin -d netops_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg[binary] pytest-json-report

      - name: Initialize database
        env:
          PGPASSWORD: netops_password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql \
            -h localhost \
            -p 5432 \
            -U netops_admin \
            -d netops_qa \
            -f sql/init_database.sql

      - name: Run data migration validations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netops_qa
          DB_USER: netops_admin
          DB_PASSWORD: netops_password
        run: |
          pytest -v

      - name: Generate 1M synthetic records
        run: |
          python src/generate_test_data.py

      - name: Initialize 1M source table
        env:
          PGPASSWORD: netops_password
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U netops_admin \
            -d netops_qa \
            -c "DROP TABLE IF EXISTS source_system.customers_1m; CREATE TABLE source_system.customers_1m (customer_id BIGINT PRIMARY KEY, first_name VARCHAR(100) NOT NULL, last_name VARCHAR(100) NOT NULL, email VARCHAR(255), status VARCHAR(20) NOT NULL, created_at TIMESTAMP NOT NULL);"

      - name: Load 1M records
        env:
          PGPASSWORD: netops_password
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U netops_admin \
            -d netops_qa \
            -c "\copy source_system.customers_1m(customer_id, first_name, last_name, email, status, created_at) FROM 'data/customers_1m.csv' WITH (FORMAT csv, HEADER true)"

      - name: Initialize 1M target table
        env:
          PGPASSWORD: netops_password
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U netops_admin \
            -d netops_qa \
            -c "DROP TABLE IF EXISTS target_system.customers_1m; CREATE TABLE target_system.customers_1m (customer_id BIGINT PRIMARY KEY, full_name VARCHAR(201) NOT NULL, email VARCHAR(255), customer_status VARCHAR(20) NOT NULL, created_at TIMESTAMP NOT NULL, migration_timestamp TIMESTAMP NOT NULL);"

      - name: Transform 1M records
        env:
          PGPASSWORD: netops_password
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U netops_admin \
            -d netops_qa \
            -c "INSERT INTO target_system.customers_1m (customer_id, full_name, email, customer_status, created_at, migration_timestamp) SELECT customer_id, first_name || ' ' || last_name, email, status, created_at, CURRENT_TIMESTAMP FROM source_system.customers_1m;"

      - name: Run 1M scale validation
        run: |
          python src/validate_scale.py

      - name: Upload 1M scale validation report
        uses: actions/upload-artifact@v4
        with:
          name: scale-validation-report
          path: reports/scale_validation_report.json

      - name: Generate migration quality report
        run: |
          python src/run_validation.py

      - name: Run migration validation agent
        run: |
          python agents/migration_validation_agent.py

      - name: Run data quality investigation agent
        run: |
          python agents/data_quality_investigation_agent.py

      - name: Run migration readiness agent
        run: |
          python agents/migration_readiness_agent.py

      - name: Generate consolidated agent assessment report
        run: |
          python agents/agent_assessment_report.py

      - name: Upload migration quality report
        uses: actions/upload-artifact@v4
        with:
          name: migration-quality-report
          path: reports/migration_quality_report.json

      - name: Upload consolidated agent assessment report
        uses: actions/upload-artifact@v4
        with:
          name: agent-assessment-report
          path: reports/agent_assessment_report.json
